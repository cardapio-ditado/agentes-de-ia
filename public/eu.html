<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#fff6ea" />
    <meta name="robots" content="noindex" />
    <title>Meu espaço</title>
    <link rel="icon" type="image/png" href="/img/favicon-brasa-food.png" />
    <style>
      /* O espaço do funcionário: o que é dele, no celular, sem login. Escala
         primeiro (é o que ele abre para ver), gorjeta, férias, treinos, e o
         atestado por foto. */
      :root {
        --brasa: #ff6b35;
        --tinta: #c2401a;
        --fundo: #fff6ea;
        --superficie: #ffffff;
        --borda: rgba(90, 40, 10, 0.16);
        --texto: #1f1c1a;
        --apoio: #6f665f;
        --ok: #1a7a4a;
        --erro: #c1121f;
        --fonte: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      }
      * { box-sizing: border-box; }
      body { margin: 0; background: var(--fundo); color: var(--texto); font: 16px/1.45 var(--fonte); }
      main { max-width: 520px; margin: 0 auto; padding: 20px 16px 60px; display: grid; gap: 16px; }
      h1 { font-size: 1.45rem; margin: 0; text-wrap: balance; }
      h2 { font-size: 1.05rem; margin: 0 0 4px; }
      p { margin: 0; }
      .apoio { color: var(--apoio); font-size: 0.92rem; }
      .cartao { background: var(--superficie); border: 1px solid var(--borda); border-radius: 14px; padding: 16px; display: grid; gap: 12px; }
      label { display: grid; gap: 4px; font-weight: 600; font-size: 0.92rem; }
      input[type="text"], input[type="tel"], input[type="date"] {
        font: inherit; padding: 12px; border-radius: 10px; border: 1px solid var(--borda); background: #fff; width: 100%;
      }
      input:focus-visible, button:focus-visible { outline: 3px solid color-mix(in srgb, var(--brasa) 45%, transparent); outline-offset: 2px; }
      .doc { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 10px 0; border-top: 1px solid var(--borda); }
      .doc:first-of-type { border-top: 0; }
      .doc span { font-weight: 600; }
      .doc small { display: block; color: var(--apoio); font-weight: 400; }
      .botao {
        font: inherit; font-weight: 700; border: 0; border-radius: 12px; padding: 14px 18px; cursor: pointer;
        background: var(--brasa); color: #1a0f0a; width: 100%;
      }
      .botao-leve { background: #fff; border: 1px solid var(--borda); color: var(--texto); width: auto; padding: 10px 14px; font-weight: 600; white-space: nowrap; flex-shrink: 0; }
      .botao:disabled { opacity: 0.55; cursor: default; }
      .ok { color: var(--ok); font-weight: 700; }
      .aviso { padding: 12px; border-radius: 10px; background: #fdecec; color: var(--erro); }
      .consentimento { display: flex; gap: 10px; align-items: flex-start; font-weight: 400; }
      .consentimento input { width: 22px; height: 22px; margin-top: 2px; flex-shrink: 0; }
      .marca { color: var(--apoio); font-size: 0.8rem; text-align: center; }
      .barra-progresso { height: 8px; border-radius: 999px; background: #f1e3d6; overflow: hidden; }
      .barra-progresso span { display: block; height: 100%; background: var(--brasa); transition: width 0.2s ease; }
      .palavras { display: grid; gap: 10px; }
      .palavra {
        font: inherit; font-size: 1.1rem; font-weight: 600; text-align: left;
        padding: 16px; border-radius: 12px; border: 2px solid var(--borda); background: #fff; color: var(--texto); cursor: pointer;
      }
      .palavra[data-mais] { border-color: var(--ok); background: #e9f5ee; }
      .palavra[data-menos] { border-color: var(--erro); background: #fdecec; }
      .palavra:disabled { opacity: 0.45; cursor: default; }
      .pergunta { font-size: 1.05rem; font-weight: 700; margin: 0; }
      .fator { display: grid; grid-template-columns: 22px 1fr 42px; gap: 8px; align-items: center; font-weight: 700; }
      .fator-trilho { height: 14px; border-radius: 999px; background: #f1e3d6; overflow: hidden; }
      .fator-trilho span { display: block; height: 100%; border-radius: inherit; }
      .fator .num { text-align: right; font-variant-numeric: tabular-nums; color: var(--apoio); }
      .dia { display: flex; justify-content: space-between; gap: 10px; padding: 8px 0; border-top: 1px solid var(--borda); }
      .dia:first-of-type { border-top: 0; }
      .dia .quando { font-weight: 700; text-transform: capitalize; }
      .folga { color: var(--apoio); }
      .par { display: flex; justify-content: space-between; gap: 10px; }
      .par strong { font-variant-numeric: tabular-nums; }
      .total { border-top: 1px solid var(--borda); padding-top: 8px; font-size: 1.1rem; }
      .opcao { display: flex; gap: 10px; align-items: flex-start; font-weight: 400; padding: 6px 0; }
      .opcao input { width: 20px; height: 20px; margin-top: 2px; flex-shrink: 0; }
      .pilha-fina { display: grid; gap: 6px; padding: 8px 0; border-top: 1px solid var(--borda); }
      .pilha-fina:first-of-type { border-top: 0; }
    </style>
  </head>
  <body>
    <main id="eu">
      <p class="apoio">Carregando…</p>
    </main>
    <script type="module" src="/js/eu.js"></script>
  </body>
</html>
