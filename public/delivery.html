<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#fff6ea" />
    <title>Delivery</title>
    <link rel="icon" type="image/png" href="/img/favicon-brasa-food.png" />
    <link rel="apple-touch-icon" href="/img/favicon-brasa-food.png" />
    <style>
      /* O delivery é pedido no sofá, no celular, com fome. A mesma base creme
         do cardápio da mesa, a cor da CASA nos botões — e a sacola sempre a um
         toque, porque é por ela que a venda sai. */
      :root {
        --marca: #c2401a; --sobre-marca: #ffffff;
        --fundo: #fff6ea; --superficie: #ffffff; --superficie-2: #fff0e2;
        --borda: rgba(90, 40, 10, 0.14); --texto: #1f1c1a; --apoio: #6f665f;
        --ok: #15803d; --alerta: #b45309; --bolha-meu: #ffe3d4; --bolha-deles: #f3ece5;
        --fonte: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      }
      * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
      /* `display` numa classe vence o atributo hidden: sem isto, a faixa de "fechado" e a
         barra da sacola apareceriam mesmo escondidas. */
      [hidden] { display: none !important; }
      body { margin: 0; background: var(--fundo); color: var(--texto); font: 16px/1.45 var(--fonte); -webkit-font-smoothing: antialiased; min-height: 100dvh; }
      button, input, select, textarea { font: inherit; color: inherit; }
      button { cursor: pointer; border: 0; border-radius: 12px; padding: 0.6rem 0.95rem; background: var(--marca); color: var(--sobre-marca); font-weight: 650; }
      button.leve { background: transparent; color: var(--texto); border: 1px solid var(--borda); }
      button:disabled { opacity: 0.5; cursor: default; }
      input, select, textarea { border: 1px solid var(--borda); border-radius: 12px; padding: 0.6rem 0.75rem; background: var(--superficie); width: 100%; }
      label { display: block; font-size: 0.85rem; font-weight: 650; margin-bottom: 0.7rem; }
      label input, label select, label textarea { margin-top: 0.25rem; font-weight: 400; }
      a { color: var(--marca); }
      .apoio { color: var(--apoio); } .pequeno { font-size: 0.85rem; } .cresce { flex: 1; min-width: 0; }
      .linha { display: flex; gap: 0.7rem; align-items: center; flex-wrap: wrap; }
      .linha > input { flex: 1; width: auto; min-width: 0; }
      .miolo { max-width: 960px; margin: 0 auto; padding: 0 16px; }
      .selo { display: inline-block; padding: 0.1rem 0.6rem; border-radius: 99px; font-size: 0.8rem; font-weight: 650; border: 1px solid var(--borda); background: var(--superficie); }
      .selo.ok { color: var(--ok); } .selo.alerta { color: var(--alerta); }

      .topo { background: var(--superficie); border-bottom: 1px solid var(--borda); padding: 1.3rem 0 1rem; }
      .topo h1 { margin: 0; font-size: 1.8rem; letter-spacing: -0.03em; }
      .topo p { margin: 0.25rem 0 0; }
      .topo img.logo { width: 52px; height: 52px; border-radius: 14px; object-fit: cover; }
      .categorias { position: sticky; top: 0; z-index: 5; background: var(--fundo); border-bottom: 1px solid var(--borda); }
      .categorias .miolo { display: flex; gap: 0.4rem; overflow-x: auto; padding-top: 0.6rem; padding-bottom: 0.6rem; scrollbar-width: none; }
      .categorias a { white-space: nowrap; text-decoration: none; color: var(--texto); border: 1px solid var(--borda); background: var(--superficie); padding: 0.3rem 0.8rem; border-radius: 99px; font-size: 0.9rem; font-weight: 650; }
      main.miolo { padding-top: 1rem; padding-bottom: 2rem; }
      body.com-sacola main.miolo { padding-bottom: 6rem; }
      #cardapio section { scroll-margin-top: 64px; }
      #cardapio h2 { font-size: 1.15rem; margin: 1.4rem 0 0.6rem; }
      .grade { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 400px), 1fr)); gap: 0.6rem; }
      .produto { display: flex; gap: 0.8rem; align-items: stretch; text-align: left; background: var(--superficie); color: var(--texto); border: 1px solid var(--borda); border-radius: 16px; padding: 0.9rem; font-weight: 400; min-height: 96px; }
      .produto:hover { border-color: var(--marca); }
      .produto .dados { flex: 1; display: flex; flex-direction: column; gap: 0.15rem; min-width: 0; }
      .produto .preco { margin-top: auto; padding-top: 0.3rem; font-weight: 750; }
      .produto .preco s { color: var(--apoio); font-weight: 400; margin-right: 0.4rem; }
      .produto img { width: 96px; height: 96px; object-fit: cover; border-radius: 12px; flex: none; }
      .faixa { display: block; width: 100%; text-align: left; padding: 0.7rem 1rem; border-radius: 14px; border: 1px solid var(--borda); background: var(--superficie); color: var(--texto); margin: 0 0 0.7rem; font-weight: 650; }
      .faixa.alerta { border-color: var(--alerta); color: var(--alerta); } .faixa.ok { border-color: var(--ok); color: var(--ok); }

      .barra-sacola { position: fixed; left: 50%; transform: translateX(-50%); bottom: max(16px, env(safe-area-inset-bottom)); width: min(560px, calc(100% - 32px)); display: flex; justify-content: space-between; align-items: center; padding: 0.9rem 1.1rem; font-size: 1.05rem; border-radius: 16px; box-shadow: 0 8px 24px rgba(0, 0, 0, 0.25); z-index: 6; }
      #sacola-quantos { background: var(--sobre-marca); color: var(--marca); border-radius: 99px; min-width: 1.6rem; padding: 0 0.4rem; text-align: center; }
      .botao-chat { position: fixed; right: 16px; bottom: max(16px, env(safe-area-inset-bottom)); width: 56px; height: 56px; border-radius: 50%; font-size: 1.4rem; padding: 0; box-shadow: 0 6px 20px rgba(0, 0, 0, 0.25); z-index: 6; }
      .com-sacola .botao-chat { bottom: calc(max(16px, env(safe-area-inset-bottom)) + 68px); }

      dialog.folha { border: 0; padding: 0; background: var(--superficie); color: var(--texto); width: min(520px, 100%); max-width: 100%; max-height: min(92dvh, 760px); border-radius: 20px; overflow: hidden; }
      dialog.folha[open] { display: flex; flex-direction: column; }
      dialog.folha > form, dialog.folha > div:only-child { display: flex; flex-direction: column; min-height: 0; flex: 1; }
      dialog::backdrop { background: rgba(0, 0, 0, 0.5); }
      .folha-topo { display: flex; justify-content: space-between; align-items: center; gap: 1rem; padding: 0.8rem 1rem; border-bottom: 1px solid var(--borda); font-size: 1.1rem; }
      .folha-miolo { overflow-y: auto; padding: 1rem; flex: 1; min-height: 0; }
      .folha-miolo h3 { font-size: 1rem; margin: 1.2rem 0 0.5rem; }
      .folha-pe { padding: 0.8rem 1rem; border-top: 1px solid var(--borda); }
      .foto-grande { width: 100%; height: 200px; object-fit: cover; }
      fieldset { border: 0; padding: 0; margin: 0 0 1rem; } legend { font-weight: 750; padding: 0; margin-bottom: 0.3rem; }
      .opcao { display: flex; align-items: center; gap: 0.6rem; padding: 0.55rem 0; border-bottom: 1px solid var(--borda); font-weight: 400; font-size: 1rem; margin: 0; }
      .opcao input { width: 1.15rem; height: 1.15rem; margin: 0; flex: none; accent-color: var(--marca); }
      .redondo { width: 2.2rem; height: 2.2rem; padding: 0; border-radius: 50%; flex: none; }
      .quantos { min-width: 1.6rem; text-align: center; font-weight: 750; }
      .item-sacola { display: flex; align-items: center; gap: 0.5rem; padding: 0.6rem 0; border-bottom: 1px solid var(--borda); }
      .escolha { display: flex; flex-wrap: wrap; gap: 0.4rem; margin-bottom: 0.7rem; }
      .escolha button { background: transparent; color: var(--texto); border: 1px solid var(--borda); font-weight: 500; }
      .escolha button.marcado { border-color: var(--marca); background: var(--bolha-meu); font-weight: 750; }
      .totais { margin-top: 1rem; padding-top: 0.6rem; border-top: 1px solid var(--borda); }
      .totais .linha { padding: 0.15rem 0; flex-wrap: nowrap; } .totais .ok { color: var(--ok); }
      .totais .total { font-weight: 800; font-size: 1.1rem; }
      .erro { color: var(--alerta); font-weight: 650; min-height: 1.2em; margin: 0.5rem 0 0; }
      .passos { list-style: none; padding: 0; margin: 0 0 1rem; }
      .passos li { position: relative; padding: 0.45rem 0 0.45rem 2rem; color: var(--apoio); }
      .passos li::before { content: ""; position: absolute; left: 0.35rem; top: 0.75rem; width: 0.8rem; height: 0.8rem; border-radius: 50%; border: 2px solid var(--borda); background: var(--superficie); }
      .passos li.feito { color: var(--texto); } .passos li.feito::before { background: var(--ok); border-color: var(--ok); }
      .passos li.agora { color: var(--texto); font-weight: 800; } .passos li.agora::before { background: var(--marca); border-color: var(--marca); box-shadow: 0 0 0 4px var(--bolha-meu); }
      .qr { display: block; width: 200px; margin: 0 auto 0.7rem; background: #fff; border-radius: 12px; }
      .pix { font-family: ui-monospace, monospace; font-size: 0.8rem; overflow-wrap: anywhere; background: var(--bolha-deles); padding: 0.6rem; border-radius: 12px; }
      .folha-chat { height: min(92dvh, 640px); }
      .conversa { flex: 1; overflow-y: auto; padding: 1rem; display: flex; flex-direction: column; gap: 0.5rem; min-height: 0; }
      .fala { max-width: 85%; padding: 0.5rem 0.8rem; border-radius: 16px; white-space: pre-wrap; overflow-wrap: anywhere; background: var(--bolha-deles); align-self: flex-start; }
      .fala.minha { background: var(--bolha-meu); align-self: flex-end; }
      .fala.sistema { border: 1px dashed var(--borda); background: transparent; }
      .digitando { align-self: flex-start; color: var(--apoio); font-size: 0.85rem; padding: 0 0.4rem; }
      .escrever { display: flex; gap: 0.5rem; padding: 0.7rem; border-top: 1px solid var(--borda); }
      @media (max-width: 560px) {
        dialog.folha { margin: auto 0 0; border-radius: 20px 20px 0 0; max-height: 94dvh; }
        .folha-chat { height: 94dvh; }
      }
      @media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }
    </style>
  </head>
  <body>
    <header class="topo">
      <div class="miolo">
        <div class="linha">
          <img class="logo" id="logo" alt="" hidden />
          <h1 id="nome-da-casa" class="cresce">Delivery</h1>
          <span id="selo-aberto" class="selo"></span>
        </div>
        <p id="resumo-da-casa" class="pequeno apoio"></p>
      </div>
    </header>
    <nav class="categorias" aria-label="Categorias"><div class="miolo" id="categorias"></div></nav>
    <main class="miolo">
      <div id="faixa-fechado" class="faixa alerta" hidden></div>
      <button id="faixa-pedido" class="faixa" hidden type="button"></button>
      <div id="cardapio"><p class="apoio">Carregando o cardápio…</p></div>
    </main>

    <button id="barra-sacola" class="barra-sacola" hidden type="button">
      <span id="sacola-quantos"></span><span>Ver sacola</span><span id="sacola-total"></span>
    </button>
    <button id="botao-chat" class="botao-chat" hidden type="button" aria-label="Falar com o atendente">💬</button>

    <dialog id="folha-produto" class="folha"><form method="dialog" id="form-produto"></form></dialog>
    <dialog id="folha-sacola" class="folha"><div id="corpo-sacola"></div></dialog>
    <dialog id="folha-pedido" class="folha"><div id="corpo-pedido"></div></dialog>
    <dialog id="folha-chat" class="folha folha-chat">
      <div class="folha-topo"><strong>Atendimento</strong><button class="leve" id="fechar-chat" type="button">Fechar</button></div>
      <div class="conversa" id="conversa" aria-live="polite"></div>
      <form id="form-chat" class="escrever">
        <input id="campo-chat" autocomplete="off" maxlength="1000" placeholder="Escreva sua mensagem…" aria-label="Mensagem" />
        <button>Enviar</button>
      </form>
    </dialog>
    <script type="module" src="/js/delivery.js"></script>
  </body>
</html>
