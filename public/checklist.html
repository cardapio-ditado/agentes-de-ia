<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Checklist — Brasa Food</title>
    <!-- Nunca indexar: o endereço carrega o token da execução no link. Se o
         Google guardar essa página, o checklist de um cliente vira resultado
         de busca aberto para qualquer um. -->
    <meta name="robots" content="noindex, nofollow" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Manrope:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="icon" type="image/png" href="/img/favicon-brasa-food.png" />
    <link rel="apple-touch-icon" href="/img/favicon-brasa-food.png" />
    <style>
      /* Página de execução: uma coisa só, no celular, com uma mão.
         Botões grandes, um cartão por pergunta, progresso sempre à vista. */
      :root {
        --carvao: #221714;
        --fundo: #191110;
        --superficie: #241813;
        --borda: #3a2a23;
        --creme: #fff8f0;
        --creme-2: #c9b4a6;
        --brasa: #ff6b35;
        --fogo: #c1121f;
        --ok: #4ecb8d;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        background: var(--fundo);
        color: var(--creme);
        font: 15px/1.55 "Manrope", system-ui, sans-serif;
        -webkit-font-smoothing: antialiased;
      }
      .topo {
        position: sticky;
        top: 0;
        z-index: 5;
        background: rgba(25, 17, 16, 0.94);
        backdrop-filter: blur(6px);
        border-bottom: 1px solid var(--borda);
        padding: 12px 16px 10px;
      }
      .topo-linha { display: flex; align-items: center; gap: 10px; }
      .chama {
        width: 30px; height: 38px; flex-shrink: 0;
        display: grid; place-items: center;
      }
      .chama img { width: 100%; height: 100%; object-fit: contain; }
      h1 {
        margin: 0; font-family: "Fraunces", serif; font-weight: 600;
        font-size: 18px; line-height: 1.2;
      }
      .sub { margin: 1px 0 0; font-size: 12.5px; color: var(--creme-2); }
      .progresso {
        margin-top: 10px; height: 6px; border-radius: 999px;
        background: rgba(255, 248, 240, 0.1); overflow: hidden;
      }
      .progresso > div {
        height: 100%; width: 0;
        background: linear-gradient(90deg, #ff6b35, #f4a100);
        border-radius: 999px; transition: width 0.25s ease;
      }
      main { padding: 14px 14px 110px; max-width: 560px; margin: 0 auto; }
      .cartao {
        background: var(--superficie);
        border: 1px solid var(--borda);
        border-radius: 14px;
        padding: 14px;
        margin-bottom: 10px;
      }
      .cartao[data-respondida="1"] { border-color: rgba(78, 203, 141, 0.4); }
      .pergunta { font-weight: 700; margin: 0 0 10px; }
      .pergunta small { color: var(--creme-2); font-weight: 500; }
      .opcoes { display: flex; gap: 8px; }
      .opcao {
        flex: 1; padding: 13px; border-radius: 12px; border: 1.5px solid var(--borda);
        background: transparent; color: var(--creme); font: inherit; font-weight: 700;
        cursor: pointer; transition: background 0.12s, border-color 0.12s;
      }
      .opcao[data-on="1"].sim { background: rgba(78, 203, 141, 0.16); border-color: var(--ok); }
      .opcao[data-on="1"].nao { background: rgba(193, 18, 31, 0.2); border-color: var(--fogo); }
      textarea, input[type="text"] {
        width: 100%; padding: 12px; border-radius: 12px;
        border: 1px solid var(--borda); background: rgba(0, 0, 0, 0.28);
        color: var(--creme); font: inherit; resize: vertical;
      }
      textarea { min-height: 70px; }
      .btn-foto {
        display: flex; align-items: center; justify-content: center; gap: 8px;
        width: 100%; padding: 13px; border-radius: 12px;
        border: 1.5px dashed rgba(255, 248, 240, 0.35);
        background: transparent; color: var(--creme); font: inherit; font-weight: 600;
        cursor: pointer;
      }
      .btn-foto img { max-height: 120px; border-radius: 8px; }
      .obs { margin-top: 8px; }
      .obs summary { font-size: 12.5px; color: var(--creme-2); cursor: pointer; }
      .obs textarea { margin-top: 6px; min-height: 48px; }
      .rodape {
        position: fixed; bottom: 0; left: 0; right: 0;
        padding: 12px 14px calc(12px + env(safe-area-inset-bottom));
        background: rgba(25, 17, 16, 0.96);
        border-top: 1px solid var(--borda);
      }
      .rodape-inner { max-width: 560px; margin: 0 auto; display: grid; gap: 8px; }
      .rodape input { text-align: center; }
      .enviar {
        padding: 14px; border: 0; border-radius: 12px;
        background: linear-gradient(135deg, #ff6b35, #c1121f);
        color: var(--creme); font: inherit; font-size: 16px; font-weight: 800;
        cursor: pointer; box-shadow: 0 6px 22px rgba(255, 107, 53, 0.35);
      }
      .enviar:disabled { opacity: 0.6; cursor: default; }
      .final { text-align: center; padding: 60px 20px; }
      .final h2 { font-family: "Fraunces", serif; font-size: 26px; margin: 14px 0 6px; }
      .final p { color: var(--creme-2); }
      .final .alertas {
        text-align: left; margin: 18px auto 0; max-width: 420px;
        background: var(--superficie); border: 1px solid var(--borda);
        border-radius: 12px; padding: 14px;
      }
      .aviso-erro {
        position: fixed; left: 14px; right: 14px; bottom: 90px; z-index: 10;
        background: #3a1116; border: 1px solid #c1121f; color: #ffd7d7;
        padding: 12px; border-radius: 12px; font-size: 14px;
      }
    </style>
  </head>
  <body>
    <header class="topo">
      <div class="topo-linha">
        <span class="chama" aria-hidden="true">
          <img src="/img/chama-brasa-food.png" alt="" />
        </span>
        <div style="min-width:0">
          <h1 id="titulo">Carregando…</h1>
          <p class="sub" id="subtitulo"></p>
        </div>
      </div>
      <div class="progresso"><div id="barra"></div></div>
    </header>

    <main id="conteudo"></main>

    <div class="rodape" id="rodape" hidden>
      <div class="rodape-inner">
        <input type="text" id="executor" placeholder="Seu nome" autocomplete="name" />
        <button class="enviar" id="btn-enviar" type="button">Concluir checklist</button>
      </div>
    </div>

    <script type="module" src="/js/checklist-run.js"></script>
  </body>
</html>
