<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Brasa — agentes de IA para bares e restaurantes</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Manrope:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/styles.css" />
    <link
      rel="icon"
      href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🔥</text></svg>"
    />
  </head>
  <body>
    <!-- ============ Acesso ============ -->
    <section id="tela-acesso" class="acesso" hidden>
      <form id="form-acesso" class="cartao-acesso">
        <div class="marca marca-grande">
          <span class="marca-icone" aria-hidden="true">
            <svg viewBox="0 0 24 24">
              <path
                d="M8.5 14.5A2.5 2.5 0 0011 12c0-1.38-.5-2-1-3-1.072-2.143-.224-4.054 2-6 .5 2.5 2 4.9 4 6.5 2 1.6 3 3.5 3 5.5a7 7 0 11-14 0c0-1.153.433-2.294 1-3a2.5 2.5 0 002.5 2.5z"
              />
            </svg>
          </span>
          <div>
            <strong class="wordmark">Brasa</strong>
            <small>Tech para bares &amp; restaurantes</small>
          </div>
        </div>
        <p class="muted">
          Informe a chave de API da sua organização. Ela fica salva só neste
          navegador.
        </p>
        <label for="campo-chave">Chave de API</label>
        <input
          id="campo-chave"
          type="password"
          autocomplete="off"
          placeholder="sk_ditado_..."
          required
        />
        <button type="submit" class="btn btn-primario btn-bloco">Entrar</button>
        <p id="erro-acesso" class="erro" role="alert" hidden></p>
      </form>
    </section>

    <!-- ============ Aplicação ============ -->
    <div id="app" class="app" hidden>
      <!-- Barra lateral -->
      <aside class="lateral" id="lateral">
        <div class="lateral-topo">
          <div class="marca">
            <span class="marca-icone" aria-hidden="true">
              <svg viewBox="0 0 24 24">
                <path
                  d="M8.5 14.5A2.5 2.5 0 0011 12c0-1.38-.5-2-1-3-1.072-2.143-.224-4.054 2-6 .5 2.5 2 4.9 4 6.5 2 1.6 3 3.5 3 5.5a7 7 0 11-14 0c0-1.153.433-2.294 1-3a2.5 2.5 0 002.5 2.5z"
                />
              </svg>
            </span>
            <div class="marca-texto">
              <strong class="wordmark">Brasa</strong>
              <small id="marca-org">—</small>
            </div>
          </div>
          <button
            id="btn-recolher"
            class="btn-icone"
            type="button"
            title="Recolher menu"
            aria-label="Recolher menu"
          >
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="M15 6l-6 6 6 6" />
            </svg>
          </button>
        </div>

        <nav class="nav" id="nav" aria-label="Seções"></nav>

        <div class="lateral-rodape">
          <button id="btn-tema" class="nav-item" type="button">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path
                d="M21 12.8A9 9 0 1111.2 3a7 7 0 009.8 9.8z"
              />
            </svg>
            <span class="nav-rotulo">Tema</span>
          </button>
          <button id="btn-sair" class="nav-item" type="button">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="M9 21H5a2 2 0 01-2-2V5a2 2 0 012-2h4M16 17l5-5-5-5M21 12H9" />
            </svg>
            <span class="nav-rotulo">Sair</span>
          </button>
        </div>
      </aside>

      <!-- Conteúdo -->
      <div class="conteudo">
        <header class="topo">
          <button
            id="btn-menu"
            class="btn-icone apenas-movel"
            type="button"
            aria-label="Abrir menu"
          >
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="M3 6h18M3 12h18M3 18h18" />
            </svg>
          </button>

          <div class="topo-titulo">
            <h1 id="titulo-pagina">Painel</h1>
            <p id="subtitulo-pagina" class="muted"></p>
          </div>

          <div class="topo-acoes">
            <label class="sr-only" for="seletor-venue">Estabelecimento</label>
            <select id="seletor-venue" class="select"></select>
          </div>
        </header>

        <main id="pagina" class="pagina" tabindex="-1"></main>
      </div>

      <div id="cortina" class="cortina" hidden></div>
    </div>

    <div id="avisos" class="avisos" aria-live="polite"></div>

    <script type="module" src="/js/app.js"></script>
  </body>
</html>
